services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "9000:9000"
    env_file:
      - .env
    volumes:
      - db_data:/data
    environment:
      DATABASE_PATH: /data/triador-aiia.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:9000
    depends_on:
      - backend

volumes:
  db_data:
